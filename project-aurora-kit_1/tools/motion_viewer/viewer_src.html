<title>오로라 모션 샘플</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one dark viewport (the game screen) on top, a control deck below it; the page commits to a single dark look like the game UI. */
:root {
  --ground: #121317;
  --deck: #1b1d22;
  --line: #30333b;
  --ink: #e8e6df;
  --muted: #9ea3ad;
  --mana: #3fe0d0;
  --amber: #e8b04a;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 32px; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
h1 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 13px; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: #0b0c10; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; }
.hud { position: absolute; left: 12px; top: 10px; font-family: var(--font-data); font-size: 12px; color: var(--muted); pointer-events: none; }
.hud b { color: var(--mana); font-weight: 500; }
.deck { display: grid; gap: 12px; background: var(--deck); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: inherit; font-size: 14px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--mana); outline-offset: 2px; }
button[aria-pressed="true"] { border-color: var(--mana); color: var(--mana); background: rgba(63, 224, 208, 0.08); }
.clips button { font-weight: 500; }
.spacer { flex: 1 1 auto; }
.time { font-family: var(--font-data); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 9.5em; text-align: right; }
.scrub { position: relative; flex: 1 1 260px; min-width: 0; }
.scrub input { width: 100%; accent-color: var(--mana); }
.marks { position: relative; height: 16px; font-family: var(--font-data); font-size: 10px; color: var(--amber); }
.marks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.beats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 8px 24px; margin: 0; padding: 0; list-style: none; }
.beats li { display: grid; grid-template-columns: 7.4em 1fr; gap: 10px; font-size: 13px; color: var(--muted); min-width: 0; }
.beats li b { font-family: var(--font-data); font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
@media (max-width: 560px) { .time { min-width: 0; text-align: left; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
body.capture .wrap { padding: 0; max-width: none; }
body.capture header, body.capture .deck, body.capture .hud { display: none; }
body.capture .stage { border: 0; border-radius: 0; width: 1280px; height: 720px; aspect-ratio: auto; }
</style>

      <button id="restart" type="button">처음부터</button>

  </section>
</div>

/* ------------------------------------------------------------ player / simulation */
const clipOrder = ['walk', 'combo', 'jump', 'mine'];
let cur = 'combo', simT = 0, animT = 0, stopLeft = 0, playing = true, speed = 1;
function resetClip(name) {
  cur = name; const C = CLIPS[name];
  seed = 12345; simT = 0; animT = 0; stopLeft = 0; shake = 0; shakeT = 0;
  debris.reset(); sparks.reset(); dust.reset(); trail.reset(); prevTip = null; rollAng = 0; rollVel = 0;
  dummy.visible = false; fp.visible = false; CH.root.visible = true; sword.visible = false; pick.visible = false;
  target.visible = true; crack.visible = false; drop.visible = false;
  sword.removeFromParent(); pick.removeFromParent();
  camera.fov = C.fp ? 70 : 38; camera.updateProjectionMatrix();
  C.start && C.start();
  C._hitIdx = 0; C._evIdx = 0;
  stepSim(0);
}
const tipA = new THREE.Vector3(), tipB = new THREE.Vector3();
/* the blade turns about its own axis so that its edge (not its flat) leads the swing */
let prevTip = null, rollAng = 0, rollVel = 0;
const _a = new THREE.Vector3(), _v = new THREE.Vector3(), _x0 = new THREE.Vector3(), _y0 = new THREE.Vector3();
function alignEdge(dt) {
  if (!sword.visible || !sword.parent || dt <= 0) return;
  const tip = wp(sword, sword.userData.tip), base = wp(sword, sword.userData.base);
  let target = 0, w = 0;
  if (prevTip) {
    _v.subVectors(tip, prevTip).divideScalar(dt);
    _a.subVectors(tip, base).normalize();
    _v.addScaledVector(_a, -_v.dot(_a));
    const sp = _v.length();
    _x0.setFromMatrixColumn(sword.matrixWorld, 0).normalize(); _y0.setFromMatrixColumn(sword.matrixWorld, 1).normalize();
    if (sp > 0.8) { _v.normalize(); target = Math.atan2(_v.dot(_y0), _v.dot(_x0)); w = Math.min(1, (sp - 0.8) / 2.5); }
  }
  const near = (x) => { while (x - rollAng > Math.PI / 2) x -= Math.PI; while (x - rollAng < -Math.PI / 2) x += Math.PI; return x; };
  const goal = near(target) * w + near(0) * (1 - w);
  rollVel += (1600 * (goal - rollAng) - 2 * 40 * rollVel) * dt; rollAng += rollVel * dt;
  sword.userData.roll.rotation.z = rollAng;

}
function stepSim(dt) {
  const C = CLIPS[cur];

  simT += dt;

  const frozen = stopLeft > 0;
  const p = C.pose(animT, frozen ? 0 : dt);
  applyPose(CH, p);
  if (C.update) C.update(animT, frozen ? 0 : dt);
  scene.updateMatrixWorld(true);
  alignEdge(frozen ? 0 : dt);

const $ = id => document.getElementById(id);

function setupControls() {
  controls = new OrbitControls(camera, canvas);

  controls.enabled = false;
